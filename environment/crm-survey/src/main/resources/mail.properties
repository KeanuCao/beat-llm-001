# ================= SMTP 发信配置 (要改就改这里) =================
mail.smtp.host=localhost
mail.smtp.port=25
mail.from=survey-noreply@company.com
mail.smtp.auth=false
mail.smtp.user=
mail.smtp.password=
mail.smtp.starttls.enable=false
mail.smtp.ssl=false

# 发出的邮件留档目录 (当年邮件网关扫盘的老习惯, 现在留个底)
mail.spool.dir=/opt/crm/mail

# 邮件里链接的对外地址
mail.base.url=http://localhost:8080
