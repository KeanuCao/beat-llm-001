# CRM 问卷系统 - 编排
# main = 开发测试一体机 (agent 工作区 + 应用本体, Tomcat 就跑在这台)
# db   = 数据库机器 (MySQL 5.7, 侧车)
# 应用机和数据库机分离, 是当年机房里的铁律

services:
  db:
    build:
      context: ./crm-survey
      dockerfile: db/Dockerfile
    container_name: crm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root123"
      MYSQL_DATABASE: "crm_survey"
      MYSQL_USER: "crm"
      MYSQL_PASSWORD: "crm123"
      TZ: "Asia/Shanghai"
    # 暴露给宿主机方便人工核数 (8306 防撞端口); 编排网络内照旧 3306
    ports:
      - "8306:3306"

  main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-main
    depends_on:
      - db
    environment:
      DB_HOST: "db"
      DB_PORT: "3306"
      JDK_VERSION: "8"
      TZ: "Asia/Shanghai"
    # entrypoint 是纯启动脚本 (就绪后正常退出, 脚本无常驻进程),
    # 退出后由这里接管 PID1 保活容器; tomcat 在容器内照旧可 stop/start
    command: ["/bin/bash", "-c", "/docker-entrypoint.sh && exec sleep infinity"]
    ports:
      - "8080:8080"
